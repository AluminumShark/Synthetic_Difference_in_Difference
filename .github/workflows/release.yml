# Release pipeline:
#   gate -> build -> TestPyPI -> real install from TestPyPI (smoke test) -> PyPI -> GitHub Release
#
# Triggers:
#   - push to main: releases automatically, but only when __version__ has no tag yet,
#     so an ordinary merge is a no-op and a merged version bump ships.
#   - push of a v* tag: releases that tag (the tag must match __version__).
#   - manual dispatch: defaults to TestPyPI only, safe for rehearsals.
#
# No API token is involved: both uploads use PyPI trusted publishing (OIDC).
# GitHub mints a short-lived identity token for this workflow, and PyPI only accepts
# the upload after verifying it really is release.yml of
# AluminumShark/Synthetic_Difference_in_Difference running in the expected environment.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        type: choice
        default: testpypi
        options:
          - testpypi
          - testpypi+pypi

permissions:
  contents: read            # least privilege by default; individual jobs widen it

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # never cancel a release midway

jobs:
  # ---------------------------------------------------------------
  # 1. Decide whether this commit should be released at all.
  #    This is what makes "merge a version bump" the release trigger:
  #    a push to main only proceeds when the version has never been tagged.
  # ---------------------------------------------------------------
  gate:
    name: Decide whether to release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                    # need the tags to know what was already released

      - name: Resolve version and decide
        id: check
        run: |
          set -euo pipefail
          # src/sdid/__init__.py is the single source of truth; pyproject.toml reads it via hatch
          version=$(python3 -c "import re,pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('src/sdid/__init__.py').read_text(encoding='utf-8')).group(1))")
          echo "package version = $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "tag             = $tag"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match package version $version (fix src/sdid/__init__.py or retag)"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "manual run, proceeding"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Push to main: release only if this version has not been released yet
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "v${version} is already tagged, nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v${version} has no tag yet, releasing it"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        env:
          VERSION: ${{ steps.check.outputs.version }}
          RELEASE: ${{ steps.check.outputs.release }}
        run: |
          if [ "$RELEASE" = "true" ]; then
            echo "### Releasing \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No release: \`$VERSION\` is already tagged" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------
  # 2. Build the distributions
  # ---------------------------------------------------------------
  build:
    name: Build distributions
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3   # setup-uv publishes no floating major tag, so pin the full version
        with:
          enable-cache: true

      - name: Run tests once more before publishing
        run: |
          uv sync --locked
          uv run pytest -q

      - name: Build sdist + wheel
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          uv build
          ls -l dist/
          # Confirm hatch resolved the dynamic version as expected
          test -f "dist/sdid-${VERSION}.tar.gz"
          test -f "dist/sdid-${VERSION}-py3-none-any.whl"

      - name: Check package metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 3. Publish to TestPyPI (the dress rehearsal)
  # ---------------------------------------------------------------
  publish-testpypi:
    name: Publish to TestPyPI
    needs: [gate, build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi                        # must match the environment of the TestPyPI trusted publisher
      url: https://test.pypi.org/p/sdid
    permissions:
      id-token: write                       # required for OIDC; trusted publishing fails without it
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true               # re-uploading the same version to TestPyPI is not an error

  # ---------------------------------------------------------------
  # 4. Smoke test: install from TestPyPI for real, so "uploads fine"
  #    cannot be mistaken for "installs fine".
  #    Dependencies (cvxpy, numpy, ...) live only on PyPI, hence the extra index.
  # ---------------------------------------------------------------
  smoke-test:
    name: Install from TestPyPI
    needs: [gate, publish-testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: pip install from TestPyPI (with retry)
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke
          installed=0
          for attempt in 1 2 3 4 5; do
            if /tmp/smoke/bin/pip install \
                 --index-url https://test.pypi.org/simple/ \
                 --extra-index-url https://pypi.org/simple/ \
                 "sdid==${VERSION}"; then
              installed=1
              break
            fi
            # A freshly uploaded version takes a few seconds to appear in the index
            echo "TestPyPI index not ready yet, retry ${attempt}..."
            sleep 20
          done
          if [ "$installed" -ne 1 ]; then
            echo "::error::could not install sdid==${VERSION} from TestPyPI"
            exit 1
          fi
          /tmp/smoke/bin/python -c "import sdid; print(sdid.__version__); assert sdid.__version__ == '${VERSION}'"

  # ---------------------------------------------------------------
  # 5. Publish to PyPI, only once the rehearsal passed
  # ---------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    needs: [gate, smoke-test]
    if: github.event_name == 'push' || inputs.target == 'testpypi+pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi                            # a required reviewer on this environment is the manual gate
      url: https://pypi.org/p/sdid
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        # No skip-existing here: a duplicate upload to production should fail loudly

  # ---------------------------------------------------------------
  # 6. Create the GitHub Release with the same artifacts.
  #    On a push to main there is no tag yet, so gh creates it from this commit.
  # ---------------------------------------------------------------
  github-release:
    name: GitHub Release
    needs: [gate, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write                       # creating a release (and its tag) needs write access
    steps:
      - uses: actions/checkout@v7           # --generate-notes needs the history
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          # 1.2.3 is a final release; anything else (1.2.3rc1, 1.2.3.dev1) is marked pre-release
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then prerelease=""; else prerelease="--prerelease"; fi
          # --target is used only when the tag does not exist yet (push to main)
          gh release create "$tag" dist/* \
            --title "$tag" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            $prerelease
