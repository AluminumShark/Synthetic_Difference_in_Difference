[project]
name = "synthetic-difference-in-difference"
version = "0.1.0"
description = "Python implementation of Synthetic Difference-in-Differences (SDID) for causal inference"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "cvxpy>=1.4.0",
    "statsmodels>=0.14.0",
    "joblib>=1.3.0",
    "matplotlib>=3.7.0",
    "scipy>=1.11.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint
    "RUF",    # ruff-specific rules
]
ignore = [
    "PLR0913",  # Too many arguments
    "PLR2004",  # Magic value comparison
]

[tool.ruff.lint.isort]
known-first-party = ["sdid"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
